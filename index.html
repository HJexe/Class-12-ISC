/* ─���─ RESET & THEME VARIABLES ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  width: 100%;
  background-color: #050507;
  color: #e2e8f0;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

:root {
  --bg-dark: #05090d;
  --bg-surface: #0a1118;
  --bg-card: #0d1622;
  --bg-card-hover: #121f2f;
  --border-subtle: #142230;
  --border-card: #1c2e40;
  --border-highlight: #28445e;
  --accent-emerald: #10b981;
  --accent-emerald-light: #34d399;
  --accent-cyan: #38bdf8;
  --accent-amber: #fbbf24;
  --accent-purple: #c084fc;
  --accent-rose: #fb7185;
  --glow-emerald: rgba(52, 211, 153, 0.4);
  --glow-cyan: rgba(56, 189, 248, 0.35);
  --font-mono: 'DM Mono', monospace;
  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-heading: 'Space Grotesk', sans-serif;
  --accent: #34d399;
  --accent-text: #f8fafc;
  --accent-on: #050507;
  --accent-border: rgba(52, 211, 153, 0.3);
  --accent-lo: rgba(52, 211, 153, 0.09);
  --accent-glow: rgba(52, 211, 153, 0.22);
}

/* Custom Scrollbars */
* { scrollbar-width: thin; scrollbar-color: #22374d transparent; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #22374d; border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-emerald-light); }

body {
  position: relative;
  background:
    linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px),
    #050507;
  background-size: 48px 48px, 48px 48px, auto;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 50% 12%, rgba(255,255,255,0.035), transparent 55%);
  z-index: 0;
}

/* ─── TOP NAVIGATION HEADER ─── */
.og-header {
  height: 58px;
  background: rgba(8, 14, 21, 0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.25rem;
  z-index: 60;
  position: sticky;
  top: 0;
  flex-shrink: 0;
  user-select: none;
}
.og-logo-dot { width: 9px; height: 9px; background: var(--accent-emerald-light); border-radius: 50%; box-shadow: 0 0 12px var(--accent-emerald-light); animation: pulseDot 2.2s infinite ease-in-out; }
.version-badge { color: #d1d5db; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
.nav-pill-btn.active { background: rgba(255,255,255,0.96); border-color: rgba(255,255,255,0.96); color: #050507; }
.btn-nav-glow-notes { background: rgba(255,255,255,0.96); border: 1px solid rgba(255,255,255,0.96); color: #050507; box-shadow: 0 10px 24px rgba(255,255,255,0.08); }
.btn-nav-glow-notes:hover { background: #ffffff; box-shadow: 0 14px 32px rgba(255,255,255,0.12); transform: translateY(-1px); }
.btn-nav-submit { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); color: #cbd5e1; }
.btn-nav-submit:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.16); color: #f8fafc; }

/* ─── VIEW 1: LANDING PAGE ─── */
.view-landing {
  display: block;
  min-height: calc(100vh - 58px);
  background: #050507;
}
.landing-container { max-width: 1200px; margin: 0 auto; padding: 4rem 1.5rem 5rem; position: relative; z-index: 1; }
.hero-section { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.25rem; max-width: 860px; margin: 0 auto 3.5rem; padding-top: 1rem; }
.hero-pill-tag { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.09); color: #e5e7eb; }
.hero-title { font-family: var(--font-heading); font-size: clamp(2.8rem, 5.5vw, 4.7rem); font-weight: 800; line-height: 1.06; letter-spacing: -0.05em; color: #f8fafc; }
.hero-subtitle { font-size: clamp(1rem, 2vw, 1.18rem); line-height: 1.65; color: #9ca3af; max-width: 680px; }
.hero-cta-group { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 0.85rem; flex-wrap: wrap; }
.btn-glow-primary { background: #ffffff; border: 1px solid #ffffff; color: #050507; box-shadow: 0 10px 25px rgba(255,255,255,0.12); }
.btn-glow-primary:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 14px 30px rgba(255,255,255,0.16); }
.btn-glow-submit { color: #e5e7eb; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.12); box-shadow: none; }
.btn-glow-submit:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); color: #fff; transform: translateY(-2px); }

/* Stats bar */
.hero-stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; max-width: 960px; margin: 0 auto 4rem; border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.02); }
.stat-item-box { background: transparent; border-right: 1px solid rgba(255,255,255,0.08); border-radius: 0; padding: 1.9rem 1.5rem; text-align: left; transition: background 0.2s; }
.stat-item-box:last-child { border-right: none; }
.stat-item-box:hover { background: rgba(255,255,255,0.03); }
.stat-number { font-family: var(--font-heading); font-size: 1.75rem; font-weight: 800; color: #f8fafc; margin-bottom: 0.8rem; }
.stat-label { font-family: var(--font-mono); font-size: 0.72rem; color: #9ca3af; letter-spacing: 0.35em; text-transform: uppercase; }

/* Section Headings */
.landing-section-header { text-align: left; margin-bottom: 2rem; }
.landing-section-tag { color: #9ca3af; letter-spacing: 0.28em; }
.landing-section-title { color: #f8fafc; }

/* Stream Cards Grid */
.stream-cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; margin-bottom: 4.5rem; }
.landing-stream-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; padding: 1.5rem; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.landing-stream-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.16); transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
.stream-card-top-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; margin-bottom: 1rem; }
.icon-commerce { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #f8fafc; }
.icon-science { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #f8fafc; }
.icon-humanities { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #f8fafc; }
.landing-stream-name { color: #f8fafc; }
.landing-stream-desc { color: #9ca3af; }
.stream-tag-pill { color: #d1d5db; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); }
.stream-open-action { color: #f8fafc; }

/* Submission Feature Banner */
.submit-banner-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.09); }
.submit-gdrive-badge { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #f8fafc; }
.submit-banner-title { color: #ffffff; }
.submit-banner-desc { color: #9ca3af; }

/* Landing Footer */
.landing-footer { border-top: 1px solid rgba(255,255,255,0.08); color: #9ca3af; }

/* Shared theme accents for other pages */
.nav-link:hover, .nav-link.active { color: var(--accent-text); border-color: var(--accent-border); background: var(--accent-lo); box-shadow: 0 0 16px var(--accent-glow), inset 0 1px 0 color-mix(in srgb, var(--accent) 15%, transparent); }
.nav-link-pip { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.nav-link--glow { border-color: var(--accent-border); background: var(--accent-lo); color: rgba(255,255,255,0.88); }
.nav-link--glow:hover { color: var(--accent-on); background: var(--accent); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow), 0 0 44px rgba(0,0,0,0.1); }
.nav-badge-new { background: var(--accent); color: var(--accent-on); }
.subject > summary { border-left-color: color-mix(in srgb, var(--subj-color, var(--accent)) 80%, transparent); }
.subject[open] > summary { color: var(--subj-color, var(--accent-text)); }
.s-count { color: color-mix(in srgb, var(--subj-color, var(--accent)) 90%, var(--fg)); border-color: color-mix(in srgb, var(--subj-color, var(--accent)) 40%, var(--border2)); }
.file-link.active { background: var(--accent-lo); border-color: var(--accent-border); color: var(--fg); }
.search-box:focus-within { border-color: var(--accent-border); }
.vi-chip.src-repo { color: var(--accent-text); border-color: var(--accent-border); background: var(--accent-lo); }
#btnOpen { color: var(--accent-text); border-color: var(--accent-border); background: var(--accent-lo); box-shadow: 0 0 10px var(--accent-glow), inset 0 1px 0 color-mix(in srgb, var(--accent) 10%, transparent); }
#btnOpen:hover { color: var(--accent-on); background: var(--accent); border-color: var(--accent); box-shadow: 0 0 24px var(--accent-glow), 0 4px 16px rgba(0,0,0,0.35); }
.color-trigger:hover, .color-trigger.open, .picker-panel, .apply-btn, .brand-dot, .nav-item.active, .nav-active-bg, .sidebar-label, .hero-title .l2, .eyebrow em, .stat-delta.up, .subject-chip.active, .focus-toggle, .chart-bar.today, .sg-fill, .sg-val, .pip-dot.running, .pip-ring-progress, .pip-link, .row-today .td-date::before { }

/* responsive */
@media (max-width: 900px) {
  .hero-stats-bar { grid-template-columns: repeat(2, 1fr); }
  .stream-cards-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .landing-container { padding-inline: 1rem; }
  .hero-title { font-size: clamp(2.4rem, 12vw, 3.5rem); }
  .hero-cta-group { flex-direction: column; }
  .btn-glow-primary, .btn-glow-submit { width: 100%; }
  .hero-stats-bar { grid-template-columns: 1fr 1fr; }
  .stat-item-box { padding: 1.4rem 1rem; }
}
</style>
