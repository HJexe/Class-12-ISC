name: generate-index

on:
  push:
    branches: [main, work]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate files.json
        run: |
          python3 - <<'EOF'
          import os, json

          SUBJECTS = [
            "English", "Economics", "Accounts", "Business Studies", "Commerce",
            "Physics", "Chemistry", "Biology", "Maths", "Computer Science",
            "Biotechnology", "Environmental Science", "History", "Political Science",
            "Geography", "Sociology", "Psychology", "Fine Arts", "Home Science"
          ]
          ALLOWED = {".pdf", ".txt", ".png", ".jpg", ".jpeg", ".doc", ".docx", ".ppt", ".pptx", ".xls", ".xlsx"}

          files = []
          for subject in SUBJECTS:
            if not os.path.isdir(subject):
              continue
            for root, dirs, filenames in os.walk(subject):
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              for fn in filenames:
                rel = os.path.join(root, fn).replace("\\", "/")
                low = fn.lower()
                if low in {"text", "text."} or low.startswith("text"):
                  files.append(rel)
                elif any(low.endswith(ext) for ext in ALLOWED):
                  files.append(rel)

          files = sorted(set(files))
          with open("files.json", "w") as f:
            json.dump(files, f, indent=2)
          print(f"✓ Indexed {len(files)} files")
          EOF

      - name: Commit files.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update file index [skip ci]"
            git push origin HEAD
          fi
